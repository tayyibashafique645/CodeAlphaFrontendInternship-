<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scientific Calculator</title>

    <link rel="stylesheet" href="calculator.css">

</head>

<body>

    <!-- =========================
         Top Header
    ========================== -->

    <header class="calculator-header">

        <a href="../index.html" class="back-button">
            ← Dashboard
        </a>

        <div class="header-content">

            <p class="small-title">
                CODEALPHA • TASK 02
            </p>

            <h1>
                Scientific Calculator
            </h1>

            <p>
                Perform basic and scientific calculations with
                a modern interactive calculator.
            </p>

        </div>

    </header>


    <!-- =========================
         Main Calculator Area
    ========================== -->

    <main class="calculator-page">

        <section class="calculator-wrapper">


            <!-- Calculator -->

            <div class="calculator">


                <!-- Display -->

                <div class="display-area">

                    <div
                        class="expression"
                        id="expression">
                    </div>

                    <input
                        type="text"
                        id="display"
                        class="display"
                        readonly
                        value="0"
                    >

                </div>


                <!-- Buttons -->

                <div class="buttons">


                    <!-- Row 1 -->

                    <button
                        class="function"
                        data-action="clear">
                        AC
                    </button>

                    <button
                        class="function"
                        data-action="delete">
                        ⌫
                    </button>

                    <button
                        class="function"
                        data-value="%">
                        %
                    </button>

                    <button
                        class="operator"
                        data-value="/">
                        ÷
                    </button>


                    <!-- Row 2 -->

                    <button
                        class="scientific"
                        data-action="sin">
                        sin
                    </button>

                    <button
                        class="scientific"
                        data-action="cos">
                        cos
                    </button>

                    <button
                        class="scientific"
                        data-action="tan">
                        tan
                    </button>

                    <button
                        class="operator"
                        data-value="*">
                        ×
                    </button>


                    <!-- Row 3 -->

                    <button
                        class="scientific"
                        data-action="sqrt">
                        √
                    </button>

                    <button
                        class="scientific"
                        data-action="square">
                        x²
                    </button>

                    <button
                        class="scientific"
                        data-action="log">
                        log
                    </button>

                    <button
                        class="operator"
                        data-value="-">
                        −
                    </button>


                    <!-- Row 4 -->

                    <button
                        class="scientific"
                        data-action="pi">
                        π
                    </button>

                    <button
                        class="scientific"
                        data-action="e">
                        e
                    </button>

                    <button
                        class="scientific"
                        data-action="reciprocal">
                        1/x
                    </button>

                    <button
                        class="operator"
                        data-value="+">
                        +
                    </button>


                    <!-- Row 5 -->

                    <button data-value="7">
                        7
                    </button>

                    <button data-value="8">
                        8
                    </button>

                    <button data-value="9">
                        9
                    </button>

                    <button data-value="(">
                        (
                    </button>


                    <!-- Row 6 -->

                    <button data-value="4">
                        4
                    </button>

                    <button data-value="5">
                        5
                    </button>

                    <button data-value="6">
                        6
                    </button>

                    <button data-value=")">
                        )
                    </button>


                    <!-- Row 7 -->

                    <button data-value="1">
                        1
                    </button>

                    <button data-value="2">
                        2
                    </button>

                    <button data-value="3">
                        3
                    </button>

                    <button
                        class="equal"
                        data-action="calculate">
                        =
                    </button>


                    <!-- Row 8 -->

                    <button
                        class="zero"
                        data-value="0">
                        0
                    </button>

                    <button data-value=".">
                        .
                    </button>

                </div>

            </div>


            <!-- =========================
                 History
            ========================== -->

            <aside class="history-panel">

                <div class="history-header">

                    <div>

                        <p class="history-label">
                            CALCULATIONS
                        </p>

                        <h2>
                            History
                        </h2>

                    </div>

                    <button
                        id="clearHistory"
                        class="clear-history">
                        Clear
                    </button>

                </div>


                <div
                    class="history-list"
                    id="historyList">

                    <p class="empty-history">
                        No calculations yet.
                    </p>

                </div>

            </aside>

        </section>

    </main>


    <script src="calculator.js"></script>

</body>

</html>
